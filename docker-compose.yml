services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrittai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

      - medrittai-data:/app/data
      - SECRET_KEY=${SECRET_KEY:-}
      - DATA_DIR=/app/data
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/medritt.db}
      - CLOUDINARY_ENABLED=${CLOUDINARY_ENABLED:-true}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:-medritt}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - NVIDIA_ENABLED=${NVIDIA_ENABLED:-true}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      - STRICT_SCAN_TYPE_VALIDATION=${STRICT_SCAN_TYPE_VALIDATION:-true}
      - SCAN_TYPE_MIN_CONFIDENCE=${SCAN_TYPE_MIN_CONFIDENCE:-0.85}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medrittai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  medrittai-data:
    driver: local
