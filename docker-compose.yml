services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrittai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

      - medrittai-data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-medrittai-hackathon-secret}
      - DATA_DIR=/app/data

      - MAIRA_API_URL=${MAIRA_API_URL:-https://grass-quiet-icy.ngrok-free.dev}
      - MAIRA_TIMEOUT_SECONDS=${MAIRA_TIMEOUT_SECONDS:-120}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_TRANSLATE_MODEL=${SARVAM_TRANSLATE_MODEL:-sarvam-translate:v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - STRICT_SCAN_TYPE_VALIDATION=${STRICT_SCAN_TYPE_VALIDATION:-true}
      - SCAN_TYPE_VERIFIER_MODEL=${SCAN_TYPE_VERIFIER_MODEL:-}
      - SCAN_TYPE_GROQ_MODEL=${SCAN_TYPE_GROQ_MODEL:-qwen/qwen3.6-27b}
      - SCAN_TYPE_MIN_CONFIDENCE=${SCAN_TYPE_MIN_CONFIDENCE:-0.85}
      - DEMO_USER=${DEMO_USER:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo123}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medrittai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  medrittai-data:
    driver: local
